<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Contact Us - EPICReach</title>
  <meta name="description" content="EPICReach - 聯絡我們">

  <link rel="stylesheet" href="src/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .legal-content h1, .legal-content h2, .legal-content h3 { font-weight: 700; color: #111827; margin-top: 1.75rem; margin-bottom: 0.75rem; }
    .legal-content h1 { font-size: 1.5rem; }
    .legal-content h2 { font-size: 1.25rem; }
    .legal-content p { color: #374151; line-height: 1.8; margin-bottom: 1.25rem; font-size: 0.95rem; }
    .legal-content ul, .legal-content ol { margin-bottom: 1.25rem; padding-left: 1.25rem; color: #374151; line-height: 1.8; }
    .legal-content li { margin-bottom: 0.5rem; }
  </style>
</head>
<body class="text-gray-700 bg-gray-50 flex flex-col min-h-screen pt-12">

  <!-- ========== { HEADER } ========== -->
  <header class="fixed top-0 left-0 right-0 z-50">
     <nav class="bg-black">
        <div class="xl:container mx-auto px-3 sm:px-4 xl:px-2">
          <div class="flex justify-between">
            <a href="index.html" class="mx-w-10 text-2xl font-bold capitalize text-white flex items-center">EPICReach</a>
            <div class="flex flex-row">
              <ul class="navbar hidden lg:flex lg:flex-row text-white text-sm items-center font-bold">
                <li class="relative border-l border-gray-800 hover:bg-gray-900"><a class="block py-3 px-6 text-white" href="index.html">Home</a></li>
                <li class="relative border-l border-gray-800 hover:bg-gray-900"><a class="block py-3 px-6 text-white" href="spotlight.html">Spotlight</a></li>
                <li class="relative border-l border-gray-800 hover:bg-gray-900"><a class="block py-3 px-6 text-white" href="techno.html">Pulse</a></li>
                <li class="relative border-l border-gray-800 hover:bg-gray-900"><a class="block py-3 px-6 text-white" href="ecosystem.html">Ecosystem</a></li>
                <li class="relative border-l border-gray-800 hover:bg-gray-900"><a class="block py-3 px-6 text-white" href="biztech.html">BizTech</a></li>
                <li class="relative border-l border-gray-800 hover:bg-gray-900"><a class="block py-3 px-6 text-white" href="insights.html">Insights</a></li>
              </ul>
            </div>
          </div>
        </div>
     </nav>
  </header>

  <!-- ========== { 主要內容區 } ========== -->
  <main class="flex-grow container mx-auto px-4 py-12 max-w-4xl">
    <div id="content" class="bg-white p-8 md:p-12 rounded-lg shadow-sm legal-content">
      <p class="text-gray-400">載入中...</p>
    </div>
  </main>

  <script>
    fetch('data/legal/contact.md')
      .then(response => {
        if (!response.ok) throw new Error('File not found');
        return response.text();
      })
      .catch(() => fetch('data/contact.md').then(res => res.text()))
      .then(text => {
        const content = text.replace(/^---[\s\S]*?---/, '');
        document.getElementById('content').innerHTML = marked.parse(content);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = `
          <h2 class="text-xl font-bold mb-4">Contact Us</h2>
          <p class="text-gray-600">目前無法載入內容，請確認專案中已建立 <code>data/legal/contact.md</code> 檔案。</p>
        `;
      });
  </script>
</body>
</html>
