<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Spotlight 文章內頁 - Tailnews</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body class="text-gray-800 pt-12 bg-white">

  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-200">
    <div class="container mx-auto px-4 flex justify-between items-center h-12">
      <a href="index.html" class="text-xl font-bold text-gray-900">Tailnews</a>
      <a href="spotlight.html" class="text-sm font-semibold text-red-600">← 返回 Spotlight 列表</a>
    </div>
  </header>

  <main class="py-10 max-w-4xl mx-auto px-4">
    <article id="article-container">
      <p class="text-gray-500 text-center py-20">文章載入中...</p>
    </article>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const urlParams = new URLSearchParams(window.location.search);
      const articleId = urlParams.get('id');

      fetch('data/news.json')
        .then(res => res.json())
        .then(newsList => {
          const article = newsList.find(item => String(item.id) === String(articleId));
          const container = document.getElementById('article-container');

          if (!article) {
            container.innerHTML = '<p class="text-gray-500 text-center py-10">找不到指定的文章。</p>';
            return;
          }

          document.getElementById('page-title').innerText = `${article.title} - Spotlight`;

          container.innerHTML = `
            <div class="mb-6">
              <span class="bg-red-600 text-white text-xs px-2.5 py-1 rounded font-semibold">Spotlight 專題採訪</span>
              <h1 class="text-3xl sm:text-4xl font-bold text-gray-900 mt-3 mb-4 leading-tight">${article.title}</h1>
              ${article.subtitle ? `<p class="text-xl text-gray-600 font-medium mb-4">${article.subtitle}</p>` : ''}
              <div class="flex items-center text-sm text-gray-500 space-x-4 border-y py-2">
                <span>作者：${article.author || 'Patrick Cheung'}</span>
                <span>•</span>
                <span>${article.date || ''}</span>
              </div>
            </div>

            ${article.image ? `
              <div class="mb-8">
                <img src="${article.image}" class="w-full h-auto max-h-[500px] object-cover rounded" alt="${article.title}">
                ${article.image_caption ? `<p class="text-xs text-gray-400 text-center mt-2">${article.image_caption}</p>` : ''}
              </div>
            ` : ''}

            <div class="prose max-w-none text-gray-800 leading-relaxed space-y-4">
              ${article.content || article.summary || '尚無內文。'}
            </div>
          `;
        });
    });
  </script>
</body>
</html>
