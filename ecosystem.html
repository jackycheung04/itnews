<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecosystem - Tailnews</title>
  <link rel="stylesheet" href="src/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- 全站標準頂部導覽列 -->
  <header class="bg-black text-white">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-14 text-sm">
      <a href="index.html" class="text-2xl font-bold tracking-wider text-white">Tailnews</a>
      <nav class="hidden md:flex space-x-6 items-center">
        <a href="index.html" class="hover:text-red-500 py-4">Home</a>
        <a href="#" class="hover:text-red-500 py-4">Pages ▾</a>
        <a href="#" class="hover:text-red-500 py-4">Sport</a>
        <a href="techno.html" class="hover:text-red-500 py-4">Techno</a>
        <a href="ecosystem.html" class="text-red-500 font-bold border-b-2 border-red-500 py-4">Ecosystem</a>
        <a href="travel.html" class="hover:text-red-500 py-4">Travel</a>
        <a href="future.html" class="hover:text-red-500 py-4">Future</a>
        <a href="#" class="hover:text-red-500 py-4">More</a>
      </nav>
      <div>
        <button class="text-gray-300 hover:text-white">🔍</button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <!-- 分類標題 -->
    <div class="flex items-center mb-6">
      <div class="h-5 w-1 bg-red-600 mr-2"></div>
      <h1 class="text-2xl font-bold text-gray-900">Ecosystem</h1>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- 左側主要新聞列表 (佔 2 欄) -->
      <div class="lg:col-span-2 space-y-8">
        
        <!-- 頭條新聞大圖 -->
        <div class="bg-white rounded overflow-hidden shadow-sm border border-gray-200">
          <a id="hero-link" href="#">
            <img id="hero-img" src="" class="w-full object-cover max-h-[420px]" alt="Hero Image">
          </a>
          <div class="p-6">
            <h2 class="text-2xl font-bold mb-3 text-gray-900">
              <a id="hero-title-link" href="#" class="hover:text-red-600">載入中...</a>
            </h2>
            <p id="hero-summary" class="text-gray-600 text-sm mb-4 line-clamp-2">摘要載入中...</p>
            <span class="text-xs text-gray-400" id="hero-date"></span>
          </div>
        </div>

        <!-- 下方新聞網格 -->
        <div id="eco-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <!-- 動態渲染 6 宮格新聞 -->
        </div>
      </div>

      <!-- 右側邊欄 (佔 1 欄) -->
      <div class="space-y-6">
        <!-- Most Popular -->
        <div class="bg-white p-5 rounded border border-gray-200 shadow-sm">
          <h3 class="text-base font-bold text-gray-900 border-b pb-3 mb-4 border-gray-200">Most Popular</h3>
          <ol id="popular-list" class="space-y-4">
            <!-- 動態渲染熱門排行 -->
          </ol>
        </div>

        <!-- 300x250 廣告區塊 -->
        <div class="bg-gray-200 p-4 rounded text-center border border-gray-300 flex flex-col items-center justify-center min-h-[300px]">
          <span class="text-xs text-gray-500 mb-2 font-semibold tracking-wider">ADVERTISEMENT</span>
          <div class="w-[300px] h-[250px] bg-black text-white flex flex-col items-center justify-center p-4">
            <span class="text-sm font-bold tracking-widest mb-1">ADVERTISEMENT</span>
            <span class="text-xs text-gray-400 mb-4">300X250</span>
            <button class="border border-white px-3 py-1 text-xs hover:bg-white hover:text-black transition">CONTACT US</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      fetch('data/news.json?t=' + new Date().getTime())
        .then(res => res.json())
        .then(data => {
          const ecoNews = data.filter(item => item.category === 'Ecosystem');
          if (!ecoNews || ecoNews.length === 0) return;

          // 1. 渲染頭條大圖
          const hero = ecoNews[0];
          const heroUrl = `ecosystem-article.html?id=${hero.id}`;
          document.getElementById('hero-title-link').innerText = hero.title;
          document.getElementById('hero-title-link').href = heroUrl;
          document.getElementById('hero-link').href = heroUrl;
          document.getElementById('hero-img').src = hero.image;
          document.getElementById('hero-summary').innerText = hero.summary || '';
          document.getElementById('hero-date').innerText = hero.date || '';

          // 2. 渲染網格新聞
          const gridNews = ecoNews.slice(1, 7);
          const gridEl = document.getElementById('eco-grid');
          gridEl.innerHTML = gridNews.map(item => `
            <div class="bg-white rounded overflow-hidden shadow-sm border border-gray-200 flex flex-col">
              <a href="ecosystem-article.html?id=${item.id}">
                <img src="${item.image}" class="w-full object-cover h-36">
              </a>
              <div class="p-3 flex-1 flex flex-col justify-between">
                <h3 class="font-bold text-sm mb-2 line-clamp-2 text-gray-900">
                  <a href="ecosystem-article.html?id=${item.id}" class="hover:text-red-600">${item.title}</a>
                </h3>
                <span class="text-xs text-red-600 font-semibold">| Ecosystem</span>
              </div>
            </div>
          `).join('');

          // 3. 渲染 Most Popular
          const popEl = document.getElementById('popular-list');
          popEl.innerHTML = ecoNews.slice(0, 5).map((item, idx) => `
            <li class="flex items-start space-x-3 border-b border-gray-100 pb-3 last:border-0">
              <span class="text-xl font-bold text-gray-300 leading-none">${idx + 1}</span>
              <a href="ecosystem-article.html?id=${item.id}" class="text-xs font-semibold text-gray-800 hover:text-red-600 line-clamp-2 leading-snug">${item.title}</a>
            </li>
          `).join('');
        });
    });
  </script>
</body>
</html>
