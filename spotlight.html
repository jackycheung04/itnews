<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotlight 專題採訪 - Tailnews</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body class="text-gray-700 pt-9 sm:pt-10">

  <!-- 導航列 Header (保持與首頁一致) -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-200">
    <div class="container mx-auto px-4 flex justify-between items-center h-12">
      <a href="index.html" class="text-xl font-bold text-gray-900">Tailnews</a>
      <nav class="hidden md:flex space-x-6 text-sm font-medium">
        <a href="index.html" class="hover:text-red-600">Home</a>
        <a href="spotlight.html" class="text-red-600 font-bold">Spotlight</a>
        <a href="biztech.html" class="hover:text-red-600">BizTech</a>
        <a href="insights.html" class="hover:text-red-600">Insights</a>
        <a href="ecosystem.html" class="hover:text-red-600">Ecosystem</a>
      </nav>
    </div>
  </header>

  <!-- 主要內容區塊 -->
  <main class="py-8 bg-gray-50 min-h-screen">
    <div class="xl:container mx-auto px-3 sm:px-4 xl:px-2">
      
      <!-- 標題區 -->
      <div class="w-full py-3 mb-4 border-b border-gray-200">
        <h1 class="text-gray-900 text-3xl font-bold">
          <span class="inline-block h-6 border-l-4 border-red-600 mr-3"></span>Spotlight 專題採訪
        </h1>
        <p class="text-gray-500 text-sm mt-1">深度人物訪談、創新企業採訪與獨家報導</p>
      </div>

      <div class="flex flex-row flex-wrap -mx-3">
        <!-- 左側文章清單 -->
        <div class="flex-shrink max-w-full w-full lg:w-2/3 px-3">
          <div id="spotlight-list-container" class="flex flex-col space-y-6">
            <p class="text-gray-500 text-center py-10">文章載入中...</p>
          </div>
        </div>

        <!-- 右側邊欄 -->
        <div class="flex-shrink max-w-full w-full lg:w-1/3 px-3 mt-8 lg:mt-0">
          <div class="w-full bg-white p-4 border border-gray-200 rounded">
            <h2 class="text-lg font-bold border-b pb-2 mb-4">專欄簡介</h2>
            <p class="text-sm text-gray-600 leading-relaxed">
              Spotlight 專區專注於採訪科技創新領袖、原創專案團隊與深度專題。所有文章均為原創採訪撰寫。
            </p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      fetch('data/news.json')
        .then(res => res.json())
        .then(newsList => {
          const container = document.getElementById('spotlight-list-container');
          // 篩選 Spotlight 文章
          const articles = newsList.filter(item => 
            (item.category && item.category.toLowerCase() === 'spotlight') || item.is_manual
          );

          if (articles.length === 0) {
            container.innerHTML = '<p class="text-gray-500 text-center py-10">目前尚無專題採訪文章。</p>';
            return;
          }

          container.innerHTML = articles.map(item => `
            <div class="bg-white p-4 rounded shadow-sm border border-gray-100 flex flex-col md:flex-row gap-4 hover:shadow-md transition-shadow">
              ${item.image ? `
                <div class="md:w-1/3 flex-shrink-0">
                  <a href="spotlight-article.html?id=${item.id}">
                    <img src="${item.image}" class="w-full h-48 object-cover rounded" alt="${item.title}">
                  </a>
                </div>
              ` : ''}
              <div class="flex-1 flex flex-col justify-between">
                <div>
                  <span class="bg-red-100 text-red-600 text-xs px-2 py-0.5 rounded font-semibold inline-block mb-2">Spotlight</span>
                  <a href="spotlight-article.html?id=${item.id}" class="hover:text-red-600">
                    <h2 class="text-xl font-bold text-gray-900 mb-2">${item.title}</h2>
                  </a>
                  <p class="text-gray-600 text-sm line-clamp-2 mb-3">${item.summary || item.subtitle || ''}</p>
                </div>
                <div class="text-xs text-gray-400 flex justify-between items-center border-t pt-2">
                  <span>作者：${item.author || 'Patrick Cheung'}</span>
                  <span>${item.date || ''}</span>
                </div>
              </div>
            </div>
          `).join('');
        })
        .catch(err => {
          console.error("載入新聞失敗:", err);
        });
    });
  </script>
</body>
</html>
