name: Auto Update IT News

on:
  schedule:
    - cron: '0 0 * * *'  # 每天香港時間早上 8 點自動執行
  workflow_dispatch:      # 允許手動點擊按鈕測試

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 取得專案程式碼
        uses: actions/checkout@v3

      - name: 2. 安裝 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 安裝必要套件
        run: pip install feedparser google-generativeai requests

      - name: 4. 執行 AI 抓新聞腳本
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_news.py

      - name: 5. 自動儲存 news.json 回 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/news.json
          git commit -m "🤖 AI 自動更新 IT 新聞" || exit 0
          git push
