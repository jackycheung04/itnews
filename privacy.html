    /* 客製化 Markdown 文章排版與字體質感 (對齊圖 2) */
    .legal-content h1, .legal-content h2, .legal-content h3 {
      font-weight: 700;
      color: #111827;
      margin-top: 1.75rem;
      margin-bottom: 0.75rem;
    }
    .legal-content h1 { font-size: 1.5rem; }
    .legal-content h2 { font-size: 1.25rem; }
    .legal-content p {
      color: #374151;
      line-height: 1.8;

  <!-- ========== { 主要內容區 } ========== -->
  <main class="flex-grow container mx-auto px-4 py-12 max-w-4xl">
    <div id="content" class="bg-white p-8 md:p-12 rounded-lg shadow-sm legal-content">
      <p class="text-gray-400">載入中...</p>
    </div>
  </main>

  <!-- JS 抓取 Markdown 檔案並渲染 -->
  <script>
    fetch('data/legal/privacy.md')
      .then(response => {
        if (!response.ok) throw new Error('File not found');
        return response.text();
      })
      .catch(() => fetch('data/privacy.md').then(res => res.text()))
      .then(text => {
        const content = text.replace(/^---[\s\S]*?---/, '');
        document.getElementById('content').innerHTML = marked.parse(content);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = `
          <h2 class="text-xl font-bold mb-4">Privacy Policy</h2>
          <p class="text-gray-600">目前無法載入隱私權政策內容，請確認倉庫中已建立 <code>data/legal/privacy.md</code> 檔案。</p>
        `;
      });
  </script>
